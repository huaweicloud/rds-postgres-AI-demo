name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @stackdowser/db
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
